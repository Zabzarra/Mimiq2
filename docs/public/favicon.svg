    <path d="M 225 165 L 375 165" stroke-width="1" opacity="0.4"></path>
    
    <path d="M 225 165 L 345 145" stroke-width="0.9" opacity="0.45"></path>
    <path d="M 375 165 L 255 145" stroke-width="0.9" opacity="0.45"></path>

    
